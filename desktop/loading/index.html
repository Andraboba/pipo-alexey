<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Пипо Алексей</title>
  <script>
    // тему выбирают в «Настройках»; оболочка передаёт её до загрузки страницы (см. main.rs)
    const t = window.__PIPO_THEME;
    document.documentElement.dataset.theme = t === "light" || t === "dark" ? t
      : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  </script>
  <style>
    /* те же цвета, что в frontend/src/styles/tokens.css */
    :root { color-scheme: dark; --bg: #141415; --text: #ededed; --muted: #a1a1a6; --faint: #85858b; --amber: #f2b33d; --red: #e5484d; }
    :root[data-theme="light"] { color-scheme: light; --bg: #fafafa; --text: #171717; --muted: #525252; --faint: #737373; --amber: #a86b00; --red: #dc2626; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 14px/20px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; user-select: none;
    }
    .box { display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 520px; padding: 24px; text-align: center; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 500; }
    .brand span { color: var(--faint); }
    .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); animation: blink 1.2s ease-in-out infinite; }
    #state { color: var(--muted); }
    #error { display: none; color: var(--muted); font-size: 13px; user-select: text; }
    #error b { display: block; color: var(--red); font-weight: 500; font-size: 14px; margin-bottom: 8px; }
    code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; color: var(--text); }
    @keyframes blink { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .lamp { animation: none; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand"><i class="lamp"></i>Пипо <span>Алексей</span></div>
    <div id="state">Запускаю…</div>
    <div id="error"></div>
  </div>
  <script>
    // оболочка вызывает это, если сервер не поднялся или упал
    window.showError = (text, log) => {
      document.getElementById("state").style.display = "none";
      document.querySelector(".lamp").style.cssText = "animation:none;background:var(--red)";
      const box = document.getElementById("error");
      box.style.display = "block";
      box.innerHTML = "<b></b><div></div>";
      box.querySelector("b").textContent = text;
      box.querySelector("div").innerHTML = "Подробности в журнале: <code></code>";
      box.querySelector("code").textContent = log;
    };
  </script>
</body>
</html>
