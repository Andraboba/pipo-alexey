[package]
name = "pipo-alexey"
version = "0.3.0"
edition = "2021"
description = "Пипо Алексей — окно приложения и значок в трее"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
getrandom = "0.3"

[features]
# окно берёт заглушку загрузки из собранных файлов, а не с dev-сервера
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
